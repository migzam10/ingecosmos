; Límites de subida para anexos PDF de la OT (y fotos).
; PHP-FPM lee este archivo desde public/ (Herd local y cPanel en producción).
; La validación de Laravel es la que fija el tope real (10 MB); estos valores
; solo dejan que el request llegue a la app sin que el servidor lo corte antes.
upload_max_filesize = 25M
post_max_size = 26M
memory_limit = 256M
